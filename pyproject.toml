[project]
name = "portal"
version = "0.0.1"
description = "Python-Trained ONNX Models in Rust"
authors = [
    {name = "Simon Janssen",email = "janssen.simon@posteo.de"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "torch (>=2.7.1,<3.0.0)",
    "torchvision (>=0.22.1,<0.23.0)",
    "onnx (>=1.18.0,<2.0.0)",
    "onnxruntime-gpu (>=1.22.0,<2.0.0)",
    "onnxslim (>=0.1.56,<0.2.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
timm = "^1.0.15"
ultralytics = "^8.3.151"
ruff = "^0.11.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"